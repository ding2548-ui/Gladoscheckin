name: Build APK

on:
  push:
    branches: [ main, master ]
    paths: [ 'app/**', '.github/workflows/build-app.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.2', channel: 'stable' }

      - name: Create Flutter project and restore source
        run: |
          cd app
          flutter create --project-name sign_helper --org com.signhelper .
          git checkout HEAD -- lib pubspec.yaml assets

      - name: Patch Android files
        run: |
          M="app/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="签到助手"|' "$M"
          cp app/android_template/build.gradle.kts app/android/app/build.gradle.kts
          mkdir -p app/android/app/src/main/kotlin/com/signhelper
          cp app/android_template/MainActivity.kt app/android/app/src/main/kotlin/com/signhelper/MainActivity.kt

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore app/android/app/keystore.jks \
            -alias signhelper \
            -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -storepass signhelper \
            -keypass signhelper \
            -dname "CN=SignHelper, OU=SignHelper, O=SignHelper, L=CN"

      - name: Build APK (arm64 only)
        working-directory: app
        run: flutter pub get && flutter pub run flutter_launcher_icons || true && flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: sign-helper-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Get version
        id: version
        working-directory: app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 签到助手 v${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 签到助手 v${{ github.run_number }}

            ### 📦 安装
            - 下载 `app-release.apk` 安装（arm64-v8a）
            - 如覆盖安装失败请先卸载旧版本

            ### ✨ 功能
            - GLaDOS 自动签到（手动/定时）
            - 签到结果微信推送（PushPlus）
            - API 返回消息汉化
            - 系统通知提醒签到结果

            ### 🔧 保后台设置
            - 忽略电池优化
            - 通知权限管理
            - 自启动/锁定后台引导

            ### 🛡️ 隐私
            - PushPlus Token 脱敏显示（仅显示后4位）
            - 所有数据本地存储，不上传第三方
