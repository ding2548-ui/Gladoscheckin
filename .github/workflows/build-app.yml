name: Build GLaDOS APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          cd app
          flutter create --project-name glados_checkin --org com.glados .
          rm -rf lib test
          rm -f pubspec.yaml

      - name: Restore source files
        run: |
          git checkout HEAD -- app/lib app/pubspec.yaml app/assets

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate icons
        working-directory: app
        run: flutter pub run flutter_launcher_icons || true

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glados-checkin-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
