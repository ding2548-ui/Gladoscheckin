name: Build APK

on:
  push:
    branches: [ main, master ]
    paths: [ 'app/**', '.github/workflows/build-app.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.2', channel: 'stable' }

      - name: Create Flutter project and restore source
        run: |
          cd app
          flutter create --project-name portal_guard --org com.portalguard .
          git checkout HEAD -- lib pubspec.yaml assets

      - name: Patch Android manifest
        run: |
          M="app/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' "$M"

      - name: Generate build.gradle.kts with proper config
        run: |
          mkdir -p "app/android/app"
          cat > "app/android/app/build.gradle.kts" << 'KTS'
plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
}

android {
    namespace = "com.portalguard"
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        applicationId = "com.portalguard"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        isCoreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    ndkVersion = "27.0.12077973"
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
KTS

      - name: Create MainActivity with battery channel
        run: |
          mkdir -p "app/android/app/src/main/kotlin/com/portalguard"
          cat > "app/android/app/src/main/kotlin/com/portalguard/MainActivity.kt" << 'EOF'
          package com.portalguard
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.content.Intent
          import android.net.Uri
          import android.os.PowerManager
          import android.provider.Settings
          import android.content.Context
          class MainActivity: FlutterActivity() {
            private val CH = "glados/battery"
            override fun configureFlutterEngine(e: FlutterEngine) {
              super.configureFlutterEngine(e)
              MethodChannel(e.dartExecutor.binaryMessenger, CH).setMethodCallHandler { call, res ->
                when (call.method) {
                  "requestIgnoreBatteryOpt" -> {
                    val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                    if (!pm.isIgnoringBatteryOptimizations(packageName))
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                    res.success("done")
                  }
                  "isIgnoringBatteryOpt" -> {
                    val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                    res.success(pm.isIgnoringBatteryOptimizations(packageName))
                  }
                  else -> res.notImplemented()
                }
              }
            }
          }
          EOF

      - name: Generate icons and build APK
        working-directory: app
        run: flutter pub get && flutter pub run flutter_launcher_icons || true && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: portal-guard-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
